services:
  localstack:
    image: localstack/localstack:latest
    restart: always
    environment:
      - SERVICES=sqs,sns,s3,secretsmanager
      - AWS_DEFAULT_REGION=us-west-2
      - EDGE_PORT=4566
    ports:
      - 4566:4566
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  init-localstack:
    image: amazon/aws-cli:latest
    depends_on:
      - localstack
    environment:
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando LocalStack inicializar...';
      sleep 15;
      echo 'Executando setup...';
      /setup.sh
      "
    volumes:
      - ./scripts/localstack/setup.sh:/setup.sh

  aws-localstack-visualizer:
    build:
      context: .
      dockerfile: AwsLocalStackVisualizer/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - localstack
      - init-localstack
    restart: unless-stopped


